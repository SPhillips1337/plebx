
services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  bridge:
    build:
      context: ./agent_api
      dockerfile: Dockerfile.bridge
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data
      - ./logs:/logs
    depends_on:
      - redis
      
  api:
    build: ./agent_api
    command: python app.py
    restart: on-failure
    environment:
      - OPENAI_API_KEY
      - ENABLE_WRITEBACK=true
      - QDRANT_URL=http://qdrant:6333
      - BRIDGE_API_URL=http://bridge:8001
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./logs:/logs
    depends_on:
      - qdrant
      - redis
      - bridge

  runner:
    build: ./agent_runner
    restart: always
    environment:
      - REPO_ROOT=/repo
      - QUEUE_PATH=/repo/data/publish_queue.jsonl
      - SUGGESTIONS_DIR=/repo/suggestions
      - LOG_PATH=/repo/logs/agent-runner.log
      - POLL_INTERVAL=10
    volumes:
      - .:/repo
    depends_on:
      - redis

  worker:
    build: ./agent_api
    command: python worker.py
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REVIEW_QUEUE_KEY=plebx:publish:queue
      - PLEBX_DB_PATH=/data/plebx.db
    volumes:
      - ./data:/data
    depends_on:
      - redis
      - api

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  qdrant_data:
